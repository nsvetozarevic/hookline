# Web EC2. The load balancer sends HTTP to nginx. php-fpm is only reachable from nginx.
name: hookline-web

services:
  app:
    image: ghcr.io/nsvetozarevic/hookline:${HOOKLINE_TAG:-latest}
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: ghcr.io/nsvetozarevic/hookline-nginx:${HOOKLINE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
