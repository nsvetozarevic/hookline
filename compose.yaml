services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hookline-app
    volumes:
      - .:/var/www/html
    env_file:
      - .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hookline

  worker:
    image: hookline-app
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --verbose --sleep=1 --tries=1
    volumes:
      - .:/var/www/html
    env_file:
      - .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hookline
    restart: unless-stopped

  scheduler:
    image: hookline-app
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file:
      - .env.docker.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hookline
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      node:
        condition: service_completed_successfully
    networks:
      - hookline

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "rm -f public/hot && npm ci && npm run build"
    networks:
      - hookline

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.docker.local
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-hookline-testing.sh:/docker-entrypoint-initdb.d/init-hookline-testing.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookline -d hookline"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hookline

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hookline

volumes:
  postgres_data:
  node_modules:

networks:
  hookline:
    driver: bridge
